name: AWS-native Terraform validation

on:
  pull_request:
    paths:
      - "aws-native/**"
      - ".github/workflows/aws-native-terraform.yml"
  push:
    branches: [main]
    paths:
      - "aws-native/**"
      - ".github/workflows/aws-native-terraform.yml"
  workflow_dispatch:
    inputs:
      run_aws_plan:
        description: "Run the protected-environment OIDC no-refresh plan"
        required: true
        default: false
        type: boolean

concurrency:
  group: aws-native-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aws-native/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked AWS-native dependencies
        working-directory: .
        run: |
          python -m pip install uv==0.11.21
          uv sync --project aws-native --locked --python 3.12
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test -no-color
      - name: Validate Lambda source package
        working-directory: .
        run: uv run --project aws-native --locked python aws-native/scripts/validate_lambda_package.py
      - name: Run AWS-native ingestion, Airflow parse and policy tests
        working-directory: .
        run: uv run --project aws-native --locked python -m unittest discover -s aws-native/tests -v
      - name: Run original MDEP V1 regressions
        working-directory: .
        run: uv run --project aws-native --locked python -m unittest discover -s tests -v

  real-spark-iceberg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: aws-native
      PYSPARK_SUBMIT_ARGS: --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0 pyspark-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Glue-compatible Spark dependencies
        run: |
          python -m pip install uv==0.11.21
          uv sync --project aws-native/spark --locked --python 3.11
      - name: Run real AWS-02 to Spark to Iceberg integration
        run: uv run --project aws-native/spark --locked python -m unittest discover -s aws-native/spark/tests -v

  gold-dbt-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Gold adapters
        run: |
          python -m pip install uv==0.11.21
          uv sync --project aws-native/gold --locked --python 3.12
      - name: Check Redshift contracts and Terraform boundary
        run: uv run --project aws-native/gold --locked python -m unittest discover -s aws-native/gold/tests_python -v
      - name: Parse the Redshift target without a live connection
        working-directory: aws-native/gold
        env:
          DBT_PROFILES_DIR: .
        run: uv run --project . --locked dbt parse --target redshift
      - name: Build and test Gold with stateful DuckDB scenarios
        run: uv run --project aws-native/gold --locked python aws-native/gold/scripts/run_integration.py
      - name: Check patch whitespace
        run: git diff --check

  oidc-no-refresh-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_aws_plan }}
    needs: [offline-validation, real-spark-iceberg, gold-dbt-validation]
    runs-on: ubuntu-latest
    environment: aws-sandbox-plan
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: aws-native/terraform
    env:
      AWS_REGION: eu-west-1
      TF_VAR_aws_region: eu-west-1
      TF_VAR_allowed_account_ids: '["${{ vars.AWS_ACCOUNT_ID }}"]'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - name: Verify protected environment and approved account inputs
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/aws-sandbox-plan")"
          jq -e '.deployment_branch_policy.custom_branch_policies == true' <<<"${environment_json}" >/dev/null
          jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))' <<<"${environment_json}" >/dev/null
          branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/aws-sandbox-plan/deployment-branch-policies")"
          jq -e '.total_count == 1 and .branch_policies[0].name == "main"' <<<"${branch_json}" >/dev/null
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_PLAN_ROLE_ARN}" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: mdep-aws01-plan
      - run: terraform init -backend=false -input=false
      - run: terraform plan -refresh=false -lock=false -input=false -out=aws01.tfplan
