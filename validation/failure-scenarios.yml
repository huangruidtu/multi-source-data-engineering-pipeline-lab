version: 1
story: MDEP-13
scenarios:
  - {id: F01, title: PostgreSQL unavailable during batch extraction, trigger: Stop postgres before Airflow task, expected_behavior: Task fails then retries without publishing partial canonical output, recovery: Restore postgres and rerun the logical interval, data_loss_risk: none if source remains available, duplicate_risk: controlled by deterministic publication key, evidence: batch task logs and object listing, executed_status: NOT_RUN}
  - {id: F02, title: REST 429 or 5xx, trigger: Configure REST fixture fault response, expected_behavior: Bounded retries honor retryable status, recovery: Clear fault and rerun interval, data_loss_risk: none when extraction fails closed, duplicate_risk: controlled by publication key, evidence: retry logs and final result, executed_status: NOT_RUN}
  - {id: F03, title: malformed input file, trigger: Submit invalid JSON or malformed CSV fixture, expected_behavior: Quarantine with reason and locator, recovery: Correct file and publish a new source version, data_loss_risk: quarantined row needs remediation, duplicate_risk: none for rejected record, evidence: quarantine object and reason, executed_status: NOT_RUN}
  - {id: F04, title: duplicate batch rerun, trigger: Run same Airflow logical interval twice, expected_behavior: Existing canonical output is reported rather than duplicated, recovery: No cleanup required, data_loss_risk: none, duplicate_risk: prevented by idempotency key, evidence: two run logs and object listing, executed_status: NOT_RUN}
  - {id: F05, title: Spark stale Bronze replay, trigger: Replay older record with different payload/hash, expected_behavior: Newer Silver version remains current, recovery: Preserve quarantine/diagnostic result and inspect ordering fields, data_loss_risk: none, duplicate_risk: history may repeat but Silver state remains unique, evidence: Iceberg query and snapshot, executed_status: NOT_RUN}
  - {id: F06, title: Debezium restart, trigger: Restart Connect, expected_behavior: Connector resumes from stored offsets, recovery: Check connector state and slot/offset position, data_loss_risk: depends on retained WAL and offsets, duplicate_risk: downstream must tolerate replay, evidence: connector status and messages, executed_status: NOT_RUN}
  - {id: F07, title: Kafka restart, trigger: Restart broker, expected_behavior: Connect and consumers recover when broker returns, recovery: Inspect health and lag before resuming, data_loss_risk: depends on retention/durability, duplicate_risk: at-least-once consumers may replay, evidence: broker/consumer logs, executed_status: NOT_RUN}
  - {id: F08, title: PostgreSQL CDC source restart, trigger: Restart postgres, expected_behavior: Logical replication resumes if WAL/slot remain valid, recovery: Verify slot and connector status, data_loss_risk: possible if WAL needed by slot is removed, duplicate_risk: replay handling required, evidence: slot LSN and connector logs, executed_status: NOT_RUN}
  - {id: F09, title: connector offset loss, trigger: Reset Connect offsets only in disposable local environment, expected_behavior: Snapshot/replay behavior is documented and isolated, recovery: Recreate connector and reconcile state, data_loss_risk: high if source history/WAL is unavailable, duplicate_risk: high; Silver idempotency required, evidence: reset procedure and reconciliation, executed_status: NOT_RUN}
  - {id: F10, title: Flink restart from checkpoint, trigger: Stop and restart job after checkpoint, expected_behavior: State restores from checkpoint, recovery: Submit from checkpoint/savepoint and compare current state, data_loss_risk: depends on completed checkpoint and source retention, duplicate_risk: sink must be idempotent, evidence: checkpoint and job logs, executed_status: NOT_RUN}
  - {id: F11, title: duplicate CDC delivery, trigger: Replay same topic record, expected_behavior: Exact replay is no-op for Silver current state, recovery: None beyond audit/reconciliation, data_loss_risk: none, duplicate_risk: Bronze archive is append history by design, evidence: keyed state result, executed_status: NOT_RUN}
  - {id: F12, title: stale lower-LSN CDC event, trigger: Deliver lower-LSN update after higher-LSN state, expected_behavior: Lower LSN is ignored, recovery: Diagnose ordering metadata, data_loss_risk: none when newer state is retained, duplicate_risk: none for current state, evidence: decision/rejection output, executed_status: NOT_RUN}
  - {id: F13, title: same-LSN transaction ordering, trigger: Deliver same-LSN transaction records with total_order, expected_behavior: Transaction order resolves deterministic winner where available, recovery: Inspect transaction metadata and transport identity, data_loss_risk: conflict is surfaced conservatively when ordering is unknown, duplicate_risk: none for resolved state, evidence: event audit columns, executed_status: NOT_RUN}
  - {id: F14, title: delete and tombstone, trigger: Delete source row and consume delete/tombstone, expected_behavior: Delete changes current state; tombstone does not mutate it again, recovery: Reconcile source and Silver keys, data_loss_risk: deletion is intentional, duplicate_risk: tombstone is harmless, evidence: event and Silver query, executed_status: NOT_RUN}
  - {id: F15, title: Iceberg or S3 sink unavailable, trigger: Remove write access or stop endpoint in disposable environment, expected_behavior: Commit fails visibly and checkpoint/retry behavior is inspected, recovery: Restore access and resume safely, data_loss_risk: depends on committed checkpoint/transaction, duplicate_risk: possible after retry without idempotency, evidence: sink/job logs, executed_status: NOT_RUN}
  - {id: F16, title: preferred_language schema evolution, trigger: Add nullable preferred_language to source and emit update, expected_behavior: Additive field is preserved or explicitly rejected by contract, recovery: Apply compatible schema update and replay, data_loss_risk: field may be unavailable until compatible deployment, duplicate_risk: no special increase, evidence: schema and row inspection, executed_status: NOT_RUN}
  - {id: F17, title: Snowflake external Iceberg metadata stale, trigger: Point external table at old metadata or delay refresh, expected_behavior: Staleness is detected and external metadata is refreshed, recovery: Update to current metadata after validation, data_loss_risk: none in Iceberg; query visibility is stale, duplicate_risk: none, evidence: metadata path and query result, executed_status: NOT_RUN}
  - {id: F18, title: dbt test failure, trigger: Introduce bounded duplicate or relationship violation, expected_behavior: dbt reports failed/warn test per severity, recovery: Correct upstream data/model and rerun test, data_loss_risk: none, duplicate_risk: diagnosis only, evidence: dbt test output, executed_status: NOT_RUN}
  - {id: F19, title: missing exchange rate, trigger: Use order with no matching DKK rate, expected_behavior: Missing rate remains visible rather than silently converted, recovery: Ingest correct reference rate then rebuild affected Gold output, data_loss_risk: analytical value temporarily incomplete, duplicate_risk: none, evidence: missing_dkk_rate count, executed_status: NOT_RUN}
  - {id: F20, title: orphan payment/order relationship, trigger: Retain payment whose order is absent from current Silver, expected_behavior: Payment is retained and warning relationship evidence is surfaced, recovery: Diagnose source/CDC ordering then reconcile, data_loss_risk: no silent discard, duplicate_risk: none, evidence: warning test and orphan query, executed_status: NOT_RUN}
