services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: commerce
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./source-data/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./source-data/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./source-data/postgres/cdc-init.sql:/docker-entrypoint-initdb.d/03-cdc-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 15

  rest-source:
    build:
      context: ./source-data/rest-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  airflow:
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/orchestration/dags
      POSTGRES_DSN: postgresql://lab:lab@postgres:5432/commerce
      REST_SOURCE_BASE_URL: http://rest-source:8080/v1
      BRONZE_LOCAL_ROOT: /opt/airflow/bronze
    ports:
      - "8081:8080"
    volumes:
      - ./:/opt/airflow/project:ro
      - ./build/mdep-8-bronze:/opt/airflow/bronze
    depends_on:
      postgres:
        condition: service_healthy
      rest-source:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.0
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mdep-connect
      CONFIG_STORAGE_TOPIC: mdep_connect_configs
      OFFSET_STORAGE_TOPIC: mdep_connect_offsets
      STATUS_STORAGE_TOPIC: mdep_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: ./processing/flink
    command: jobmanager
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-1.20.0.jar
      PYTHONPATH: /opt/flink/usrlib
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    ports:
      - "8082:8081"
    volumes:
      - ./processing/flink:/opt/flink/usrlib/mdep:ro
      - ./build/mdep-11-checkpoints:/opt/flink/checkpoints
      - ./build/mdep-11-savepoints:/opt/flink/savepoints

  flink-taskmanager:
    build:
      context: ./processing/flink
    command: taskmanager
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-1.20.0.jar
      PYTHONPATH: /opt/flink/usrlib
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./processing/flink:/opt/flink/usrlib/mdep:ro
    depends_on:
      - flink-jobmanager

volumes:
  postgres_data:
