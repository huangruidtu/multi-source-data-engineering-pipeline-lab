version: 2

sources:
  - name: cdc_silver
    description: >-
      AWS-05 Iceberg v2 current-state ledgers. Durable is_deleted tombstones are
      filtered by staging. DuckDB uses bounded fixture_* seeds by default, or
      checksummed AWS-07 bridge tables only when integrated mode is explicit.
    schema: "{{ env_var('MDEP_CDC_SILVER_SCHEMA', 'silver_cdc') }}"
    tables:
      - name: core_customers
      - name: core_products
      - name: core_orders
      - name: core_payments

  - name: silver_iceberg
    description: AWS-03 Iceberg v2 tables exposed through the parameterized Redshift external schema.
    schema: "{{ env_var('MDEP_SILVER_EXTERNAL_SCHEMA', 'silver_iceberg') }}"
    tables:
      - name: ref_exchange_rates
      - name: ref_locations
